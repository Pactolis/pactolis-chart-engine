name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: npm test
      - run: npm run check:exports
      - run: npm run check:default-import-graph
      - run: npm pack --dry-run

  # Decides which browser projects this PR needs from the files it changes
  # (scripts/select-ci-tests.mjs). The Node matrix above always runs in full.
  changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      browser: ${{ steps.select.outputs.browser }}
      browser_specs: ${{ steps.select.outputs.browser_specs }}
      census: ${{ steps.select.outputs.census }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          # The merge commit and its first parent (the base tip) give the PR diff.
          fetch-depth: 2
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - id: select
        run: node scripts/select-ci-tests.mjs

  browser:
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.browser != 'none'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci --no-audit --no-fund
      - run: npm run check:browser
      - run: npx --no-install playwright install --with-deps chromium
      - name: Default browser project (selected specs)
        env:
          # Validated by the selector: repository paths of existing specs only.
          SPECS: ${{ needs.changes.outputs.browser_specs }}
        run: npm run test:browser -- --project=default $SPECS
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-results
          path: test-results/
          retention-days: 3

  census:
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.census == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci --no-audit --no-fund
      - run: npx --no-install playwright install --with-deps chromium
      - run: npm run test:browser -- --project=census --workers=1
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: census-results
          path: test-results/
          retention-days: 3
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: census-evidence
          path: test-results/**/census-evidence.json
          retention-days: 3
          if-no-files-found: error

  # Tam is the largest census profile (about 5.5 minutes). It runs whenever the
  # census spec is selected, in parallel with the census job instead of after it.
  census-tam:
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.census == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci --no-audit --no-fund
      - run: npx --no-install playwright install --with-deps chromium
      - run: npm run test:browser -- --project=census-load --grep "#308 Tam" --workers=1
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: census-tam-results
          path: test-results/
          retention-days: 3

  # One stable result for reviewers: fails if any job that ran failed or was
  # cancelled; jobs the selection skipped count as passing.
  ci-result:
    name: CI result
    needs: [test, changes, browser, census, census-tam]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          node --input-type=module -e '
          const needs = JSON.parse(process.env.RESULTS);
          const bad = Object.entries(needs).filter(([, job]) => job.result === "failure" || job.result === "cancelled");
          for (const [name, job] of Object.entries(needs)) console.log(`${name}: ${job.result}`);
          if (bad.length) { console.error(`Failed: ${bad.map(([name]) => name).join(", ")}`); process.exit(1); }
          '
