name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: npm test
      - run: npm run check:exports
      - run: npm pack --dry-run

  browser:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci --no-audit --no-fund
      - run: npm run check:browser
      - run: npx --no-install playwright install --with-deps chromium
      - run: npm run test:browser -- --project=default
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-results
          path: test-results/
          retention-days: 3

  census-shards:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci --no-audit --no-fund
      - run: npx --no-install playwright install --with-deps chromium
      - run: npm run test:browser -- --project=census --fully-parallel --workers=1 --shard=${{ matrix.shard }}/2
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: census-results-${{ matrix.shard }}
          path: test-results/
          retention-days: 3

  census:
    name: census
    needs: census-shards
    if: ${{ always() && github.event_name == 'pull_request' }}
    runs-on: ubuntu-24.04
    steps:
      - run: |
          if [ "${{ needs.census-shards.result }}" != "success" ]; then
            echo "Census shards did not all succeed"
            exit 1
          fi
