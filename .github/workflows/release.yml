name: Release

# When main carries a package.json version that has no GitHub release yet, build the
# package and attach the npm tarball to a new release tagged v<version>. Applications
# can install it from the release URL until the package is published to npm.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Find the version to release
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$(node -p "require('./package.json').version")"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "$tag is already released."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v7
        if: steps.version.outputs.exists == 'false'
        with:
          node-version: 26
      - if: steps.version.outputs.exists == 'false'
        run: npm ci --no-audit --no-fund
      - if: steps.version.outputs.exists == 'false'
        run: npm run check
      - if: steps.version.outputs.exists == 'false'
        run: npm test
      - if: steps.version.outputs.exists == 'false'
        run: npm run check:exports
      - if: steps.version.outputs.exists == 'false'
        run: npm pack
      - name: Create the release with the package tarball
        if: steps.version.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: gh release create "$TAG" pactolis-chart-engine-*.tgz --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$TAG" --generate-notes
